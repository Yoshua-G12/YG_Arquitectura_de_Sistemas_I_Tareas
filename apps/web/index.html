<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Administración de productos" />
    <title>Inventario | Productos</title>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Panel de inventario</p>
        <h1>Productos claros, inventario bajo control.</h1>
        <p class="intro">Administra el catálogo y revisa el estado de existencias en tiempo real.</p>
      </header>
      <section class="workspace" aria-label="Administración de productos">
        <form id="product-form" class="card form-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Catálogo</p>
              <h2 id="form-title">Nuevo producto</h2>
            </div>
            <span class="form-mark">+</span>
          </div>
          <label>Nombre<input id="nombre" name="nombre" required maxlength="100" /></label>
          <label>Precio (Q)<input id="precio" name="precio" type="number" min="0" step="0.01" required /></label>
          <label>Stock<input id="stock" name="stock" type="number" min="0" step="1" required /></label>
          <p id="form-error" class="message error" role="alert" hidden></p>
          <div class="form-actions">
            <button id="submit-button" class="button primary" type="submit">Guardar producto</button>
            <button id="cancel-button" class="button ghost" type="button" hidden>Cancelar</button>
          </div>
        </form>
        <section class="card list-card" aria-labelledby="list-title">
          <div class="section-heading">
            <div><p class="eyebrow">Resumen</p><h2 id="list-title">Productos</h2></div>
            <span id="product-count" class="count">0</span>
          </div>
          <p id="status-message" class="message" role="status">Cargando productos...</p>
          <div id="product-list" class="product-list"></div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
