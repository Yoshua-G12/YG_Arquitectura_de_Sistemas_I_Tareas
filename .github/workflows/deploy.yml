name: Deploy HW-04 to AWS S3 & CloudFront

on:
  push:
    branches:
      - hw-04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project with Vite
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "Error: dist/index.html no fue generado." && exit 1)
          echo "dist/index.html verificado exitosamente."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to AWS S3 & CloudFront
    needs: build
    runs-on: ubuntu-latest
    if: >-
      (secrets.AWS_ROLE_ARN != '' || vars.AWS_ROLE_ARN != '') &&
      (secrets.AWS_REGION != '' || vars.AWS_REGION != '') &&
      (secrets.S3_BUCKET != '' || vars.S3_BUCKET != '') &&
      (secrets.CLOUDFRONT_DISTRIBUTION_ID != '' || vars.CLOUDFRONT_DISTRIBUTION_ID != '')

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist

      - name: Verify downloaded artifact
        run: |
          test -f dist/index.html || (echo "Error: dist/index.html no se encuentra en el artefacto descargado." && exit 1)
          echo "Artefacto dist/ verificado correctamente."

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Sync dist/ to Amazon S3
        run: |
          aws s3 sync dist/ s3://${S3_BUCKET} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

