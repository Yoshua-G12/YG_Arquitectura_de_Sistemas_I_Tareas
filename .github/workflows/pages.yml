name: Deploy HW-04 to GitHub Pages

on:
  push:
    branches:
      - hw-04
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Verify hw-04 branch
        run: |
          test "${GITHUB_REF}" = "refs/heads/hw-04" || (echo "Error: este workflow solo debe ejecutarse desde hw-04." && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build project for GitHub Pages
        run: npm run build:pages

      - name: Verify Pages build output
        run: |
          test -f dist/index.html || (echo "Error: dist/index.html no fue generado." && exit 1)
          grep -q "/YG_Arquitectura_de_Sistemas_I_Tareas/" dist/index.html || (echo "Error: la base de GitHub Pages no se aplico al build." && exit 1)
          echo "dist/index.html verificado para GitHub Pages."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
